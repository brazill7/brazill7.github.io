name: Deploy Portfolio

on:
  push:
    branches:
      - main
    paths:
      - 'portfolio/**'

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4

      - name: Install and Build 🔧
        working-directory: ./portfolio
        run: |
          npm install
          npm run build
          # Create subfolder structure so the site works at /portfolio/
          mkdir -p final_dist/portfolio
          cp -r dist/* final_dist/portfolio/

      - name: Deploy 🚀
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: portfolio/final_dist
          branch: gh-pages
          clean: false # Set to false if you have other folders in gh-pages
